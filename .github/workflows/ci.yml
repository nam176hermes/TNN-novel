name: CI

"on":
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for environment-script tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create project Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Install frontend dependencies for environment-script tests
        run: npm --prefix web ci

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q app scripts tests

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Run Python tests
        env:
          NOVEL_PIPELINE_IGNORE_DOTENV: "1"
        run: .venv/bin/python -m pytest -q -s

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run browser E2E tests
        run: npm --prefix web run test:e2e -- --project=chromium

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t novel-pipeline:ci .

      - name: Run container
        run: |
          docker run -d \
            --name novel-pipeline-ci \
            -p 127.0.0.1:7860:7860 \
            -e PUBLIC_DEPLOY=1 \
            -e MOBILE_API_SECRET=ci-only-not-a-real-secret-000000000000 \
            -e MOBILE_API_ADMIN_USERNAME=ci-operator \
            -e MOBILE_API_ADMIN_PASSWORD=ci-only-not-a-real-password \
            -e MOBILE_API_CORS_ORIGINS=https://ci.example.test \
            novel-pipeline:ci

      - name: Smoke container
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/api/ready
          curl -fsS http://127.0.0.1:7860/ | grep -q '<div id="root"></div>'

      - name: Stop container
        if: always()
        run: |
          docker logs novel-pipeline-ci || true
          docker rm -f novel-pipeline-ci || true
