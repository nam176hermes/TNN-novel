name: CI

"on":
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Run Python tests
        run: python -m pytest -q -s

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Run frontend tests
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t novel-pipeline:ci .

      - name: Run container
        run: |
          docker run -d --rm \
            --name novel-pipeline-ci \
            -p 127.0.0.1:7860:7860 \
            -e MOBILE_API_SECRET=ci-secret-not-for-production \
            -e MOBILE_API_ADMIN_PASSWORD=ci-password \
            novel-pipeline:ci

      - name: Smoke container
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/api/ready
          curl -fsS http://127.0.0.1:7860/ | grep -q '<div id="root"></div>'

      - name: Stop container
        if: always()
        run: docker rm -f novel-pipeline-ci || true
