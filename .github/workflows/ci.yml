name: CI

"on":
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for environment-script tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create project Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Install frontend dependencies for environment-script tests
        run: npm --prefix web ci

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q app scripts tests

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Run Python tests
        env:
          NOVEL_PIPELINE_IGNORE_DOTENV: "1"
        run: .venv/bin/python -m pytest -q -s

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run browser E2E tests
        run: npm --prefix web run test:e2e -- --project=chromium

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API and import-worker images
        run: |
          docker build --target api -t novel-pipeline-api:ci .
          docker build --target import-worker -t novel-pipeline-import-worker:ci .

      - name: Verify browser execution isolation
        run: scripts/smoke-browser-execution-isolation.sh

      - name: Smoke worker and API runtime
        env:
          CI_DOCKER_RELEASE_ID: ${{ github.sha }}
          CI_DOCKER_GIT_SHA: ${{ github.sha }}
          CI_DOCKER_IMAGE_DIGEST: sha256:${{ github.sha }}
        run: scripts/ci-docker-runtime-smoke.sh
