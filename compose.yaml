services:
  novel-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: novel-pipeline:local
    container_name: novel-pipeline
    restart: unless-stopped
    ports:
      - "${MOBILE_API_BIND:-127.0.0.1}:${MOBILE_API_PORT:-7860}:7860"
    environment:
      DATA_DIR: /data
      MOBILE_API_HOST: 0.0.0.0
      MOBILE_API_PORT: 7860
      MOBILE_API_SERVE_WEB: "1"
      WEB_DIST_DIR: /app/web/dist
      MOBILE_API_SECRET: "${MOBILE_API_SECRET:?Set MOBILE_API_SECRET in .env before running docker compose}"
      MOBILE_API_ADMIN_USERNAME: "${MOBILE_API_ADMIN_USERNAME:-admin}"
      MOBILE_API_ADMIN_PASSWORD: "${MOBILE_API_ADMIN_PASSWORD:?Set MOBILE_API_ADMIN_PASSWORD in .env before running docker compose}"
      MOBILE_API_CORS_ORIGINS: "${MOBILE_API_CORS_ORIGINS:-http://localhost,http://127.0.0.1}"
      REMOTE_API_KEY: "${REMOTE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434/v1}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:14b}"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7860/api/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
