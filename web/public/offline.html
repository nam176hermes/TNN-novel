<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031b15" />
    <title>Novel-TNN offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #03100d;
        color: #f5efe4;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: rgb(255 255 255 / 5%);
        border: 1px solid rgb(52 211 153 / 22%);
        border-radius: 12px;
        box-shadow: 0 24px 60px rgb(0 0 0 / 30%);
        margin: 0 auto;
        max-width: 520px;
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 10px;
      }

      p {
        color: rgb(245 239 228 / 76%);
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
      }

      strong {
        color: #6ee7b7;
      }

      button {
        background: #047857;
        border: 1px solid rgb(52 211 153 / 36%);
        border-radius: 8px;
        color: #f5efe4;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        margin-top: 18px;
        min-height: 40px;
        padding: 9px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang offline</h1>
      <p>
        App shell có thể mở khi offline, nhưng đăng nhập, import, dịch, TTS, export và thao tác tài khoản vẫn cần backend.
        <strong>Chỉ chương/audio đã cache thủ công</strong> trong reader mới có thể đọc hoặc phát lại khi mất mạng.
      </p>
      <button type="button" onclick="window.location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
