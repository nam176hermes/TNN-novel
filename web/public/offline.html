<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031b15" />
    <title>Novel-TNN offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #03100d;
        color: #f5efe4;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: rgb(255 255 255 / 5%);
        border: 1px solid rgb(52 211 153 / 22%);
        border-radius: 12px;
        box-shadow: 0 24px 60px rgb(0 0 0 / 30%);
        margin: 0 auto;
        max-width: 520px;
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 10px;
      }

      p {
        color: rgb(245 239 228 / 76%);
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
      }

      strong {
        color: #6ee7b7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Novel-TNN is offline</h1>
      <p>
        The app shell can open offline, but import, translation, TTS, export, and account actions still need the backend.
        <strong>Cached chapters only</strong> are available when you previously used the reader offline cache.
      </p>
    </main>
  </body>
</html>
